<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 380"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e1a"/><stop offset="50%" stop-color="#121829"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".85"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><radialGradient id="glowCyan" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".35"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><radialGradient id="glowPurple" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".3"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><radialGradient id="glowGreen" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#10b981" stop-opacity=".25"/><stop offset="100%" stop-color="#10b981" stop-opacity="0"/></radialGradient><pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".5" d="M 40 0 L 0 0 0 40"/></pattern><filter id="dropShadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="6" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter><filter id="badgeShadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="3" flood-color="#000" flood-opacity=".4" stdDeviation="6"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatReverse{0%{transform:translateY(0)}50%{transform:translateY(7px)}}@keyframes pulseGlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.45;transform:scale(1.08)}}@keyframes pulseGreenDot{0%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}.subtitle-text,.tag-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:48px;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:20px;fill:#94a3b8}.tag-text{font-weight:600;font-size:13px;fill:#cbd5e1}.badge-label{font-family:&quot;Fira Code&quot;,monospace,-apple-system,sans-serif;font-size:12px;font-weight:600}.animated-float-1{animation:floatSlow 6s ease-in-out infinite}.animated-float-2{animation:floatReverse 7s ease-in-out infinite}.animated-glow-1{transform-origin:200px 100px;animation:pulseGlow 8s ease-in-out infinite}.animated-glow-2{transform-origin:1000px 280px;animation:pulseGlow 9s ease-in-out infinite}.status-dot{transform-origin:center;animation:pulseGreenDot 2s ease-in-out infinite}</style></defs><rect width="1200" height="380" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="380" fill="url(#gridPattern)" rx="16"/><circle cx="200" cy="100" r="180" fill="url(#glowCyan)" class="animated-glow-1"/><circle cx="1000" cy="280" r="220" fill="url(#glowPurple)" class="animated-glow-2"/><circle cx="600" cy="190" r="140" fill="url(#glowGreen)" opacity=".3"/><g class="animated-float-1" filter="url(#badgeShadow)"><rect width="220" height="42" x="50" y="45" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="21"/><circle cx="72" cy="66" r="5" fill="#10b981" class="status-dot"/><text x="88" y="70" fill="#38bdf8" class="badge-label">PASS</text><text x="132" y="70" fill="#e2e8f0" class="badge-label">unit.test.ts</text><text x="222" y="70" fill="#64748b" class="badge-label">0.2s</text></g><g class="animated-float-2" filter="url(#badgeShadow)"><rect width="220" height="42" x="930" y="45" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity=".4" stroke-width="1" rx="21"/><text x